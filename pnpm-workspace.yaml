packages:
  - packages/*

allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  unrs-resolver: false

# Versions shared by the workspace packages. Storybook packages must all be on
# the same version, so that the docs Storybook and the addon build against the
# same storybook instance.
catalog:
  '@storybook/addon-docs': ^11.0.0-beta.3
  '@storybook/addon-links': ^11.0.0-beta.3
  '@storybook/react-vite': ^11.0.0-beta.3
  eslint: ^9.39.5
  eslint-plugin-storybook: ^11.0.0-beta.3
  prop-types: ^15.8.1
  react: ^18.3.1
  react-dom: ^18.3.1
  storybook: ^11.0.0-beta.3
  typescript: ^6.0.3
  vite: ^8.3.8

# Generated by `pnpm audit --fix`. The @octokit entries patch the outdated tree
# pulled in by `auto`. The glob entry patches the glob 10 and 13 copies that Jest
# pulls in. The minimatch entry can go once typescript-eslint is on 8.73.0 or
# later.
overrides:
  '@octokit/plugin-paginate-rest@>=1.0.0 <9.2.2': ^9.2.2
  '@octokit/request-error@>=1.0.0 <5.1.1': ^5.1.1
  '@octokit/request@>=1.0.0 <8.4.1': ^8.4.1
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
