packages:
  - packages/*

allowBuilds:
  esbuild: true
  unrs-resolver: false

# Versions shared by the workspace packages. Storybook packages must all be on
# the same version, so that the docs Storybook and the addon build against the
# same storybook instance.
catalog:
  '@storybook/addon-docs': 10.6.5
  '@storybook/addon-links': 10.6.5
  '@storybook/react-vite': 10.6.5
  eslint: ^9.39.1
  eslint-plugin-storybook: 10.6.5
  jest: ^30.2.0
  prop-types: ^15.8.1
  react: ^18.2.0
  react-dom: ^18.2.0
  storybook: 10.6.5
